name: CI Code Quality & Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Code & Asset Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c assets/js/products.js
          node -c assets/js/app.js
          node -c sw.js
          echo "✅ All JavaScript files passed syntax compilation without errors."

      - name: Validate JSON Files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'));"
          echo "✅ All JSON configuration files parsed successfully."

      - name: Validate Asset Linking in Storefront
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const requiredAssets = [
              'assets/css/styles.css',
              'assets/js/products.js',
              'assets/js/app.js',
              'manifest.json'
            ];
            for (const asset of requiredAssets) {
              if (!html.includes(asset)) {
                console.error('❌ Missing link in index.html for: ' + asset);
                process.exit(1);
              }
            }
            console.log('✅ All production assets properly linked in index.html.');
          "
